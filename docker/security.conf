# Endurecimento do Apache para o NeoAlice (revisão de segurança 2026-09).
#
# Carregado em /etc/apache2/conf-enabled/ pelo Dockerfile. É um arquivo de
# configuração, e não um .htaccess, porque a imagem php:7.4-apache usa
# "AllowOverride None" em /var/www/ — .htaccess ali é simplesmente ignorado.
#
# Motivo: compose.yaml monta o repositório INTEIRO em /var/www/html, então
# .env (senhas do MySQL), .git/ (histórico completo) e quimica.sql ficavam
# acessíveis por HTTP.

ServerTokens Prod
ServerSignature Off

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
</Directory>

# Diretórios que nunca devem ser servidos.
<DirectoryMatch "^/var/www/html/(\.git|\.github|\.vscode|__lixo|docker|banco/migracoes)/">
    Require all denied
</DirectoryMatch>

# Qualquer arquivo iniciado por ponto (.env, .gitignore, .dockerignore, ...).
<FilesMatch "^\.">
    Require all denied
</FilesMatch>

# Dumps, documentação, configuração de build e afins.
<FilesMatch "\.(sql|md|ya?ml|sh|log|bak|dist|example|ini)$">
    Require all denied
</FilesMatch>

<FilesMatch "^(Dockerfile|LICENSE|info\.php)$">
    Require all denied
</FilesMatch>

# uploads/ recebe arquivo enviado por professor e fica dentro do webroot.
# Nada ali pode ser executado: o material didático é servido como arquivo
# estático, nunca como script.
<Directory /var/www/html/uploads>
    php_flag engine off
    Options -ExecCGI -Indexes
    AddType text/plain .php .phtml .php3 .php4 .php5 .php7 .phps .pl .py .cgi .sh
    <FilesMatch "\.(?i:php|phtml|php[0-9]|phps|pl|py|cgi|sh)$">
        Require all denied
    </FilesMatch>
</Directory>
